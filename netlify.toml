# Netlify deploy config for the HighSocietyScape web app.
#
# The app is a static Vite + React build in web/, but it imports shared code
# from the repo ROOT (../lib, ../xp_table.json, ../data) — so the build runs
# from the root (not from web/) and just points npm at the web/ subfolder.
#
# Supabase config for the frontend. Both are the PUBLIC anon/publishable pair —
# safe to expose in a frontend (they already ship in the built JS; row-level
# security is what protects the data). Set here in-repo rather than in the
# Netlify dashboard so cloud save works on the free plan (no dashboard env-var
# access needed). To point at a different project, edit the two values below.
# Leave them blank to ship an offline build (gear/progress live in the session only).

[build]
  command = "npm --prefix web ci && npm --prefix web run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_SUPABASE_URL = "https://gfgcerrmaxkskzldiuuu.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_HGLRhQViEoWcdfupaZWkhw_MauXIki4"

# Single-page app: serve index.html for any path that isn't a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
